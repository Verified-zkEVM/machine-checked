name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Fetch Mathlib's cache
        run: lake exe cache get

      - name: No sorry, axiom or native_decide in the sources
        run: |
          # Declarations and tactic uses, not mentions in comments or docstrings.
          if grep -rnE '^\s*(private |protected )?axiom\s|^\s*(by\s+)?native_decide\b|:=\s*by\s+native_decide\b|<;>\s*native_decide\b|\bsorry\b\s*$|:=\s*sorry\b|by\s+sorry\b' \
              --include='*.lean' --exclude-dir=.lake MachineChecked lprog lprog-riscv pancake Cases Tools scripts; then
            echo "::error::found sorry, axiom or native_decide"; exit 1
          fi

      # Everything: the framework, the tools and every case study. No warning is allowed, in
      # any of them.
      - name: Build everything
        run: |
          set -eo pipefail
          lake build MachineChecked Tools Cases 2>&1 | tee build.log
          # Lean's diagnostics, not Lake's notices (e.g. a dependency built from source).
          if grep -E '^warning: .*\.lean:' build.log; then
            echo "::error::the build has warnings"; exit 1
          fi

      # Each instruction set's LIMITS.md has a table of its instructions, lifted or not, that
      # the tool generates from the lift.
      - name: The instruction tables of the LIMITS.md are the generated ones
        run: |
          lake build decompile
          python3 scripts/decompile-check/check.py limits

      - name: decompile --to lean, end to end, on a small ELF
        run: scripts/to-lean-check/check.sh

      - name: Axiom check, framework and case studies
        run: |
          set -o pipefail
          for f in scripts/AxiomCheck.lean scripts/AxiomCheckCases.lean; do
            lake env lean "$f" 2>&1 | tee -a axioms.log
          done
          # Every listed axiom must be a standard one or a bv_decide certificate.
          bad=$(tr ',[]' '\n\n\n' < axioms.log | sed 's/^ *//; s/ *$//' \
            | grep -vE "^$|depends on axioms:|does not depend on any axioms|^(propext|Classical\.choice|Quot\.sound)$|\.bv_decide\.ax_" || true)
          if [ -n "$bad" ]; then
            echo "::error::non-standard axioms: $bad"; exit 1
          fi
