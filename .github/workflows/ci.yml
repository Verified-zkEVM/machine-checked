name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Also build every case study (a few hours)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Fetch Mathlib's cache
        run: lake exe cache get

      - name: No sorry, axiom or native_decide in the sources
        run: |
          # Declarations and tactic uses, not mentions in comments or docstrings. The vendored
          # specification libraries under Cases/Zip2005/Spec are upstream code and are checked
          # by their own axiom census (Spec/Zip2005.lean) instead.
          if grep -rnE '^\s*(private |protected )?axiom\s|^\s*(by\s+)?native_decide\b|:=\s*by\s+native_decide\b|<;>\s*native_decide\b|\bsorry\b\s*$|:=\s*sorry\b|by\s+sorry\b' \
              --include='*.lean' --exclude-dir=Spec --exclude-dir=.lake MachineChecked lprog lprog-riscv pancake Cases Tools scripts; then
            echo "::error::found sorry, axiom or native_decide"; exit 1
          fi

      # The case studies are not built on pull requests for now (see `Cases/README.md`); the
      # on-demand `full` job builds them. The two proved with `lsym` are, since they check the
      # tactic on real code, and take seconds.
      - name: Build the framework and the tools
        run: |
          set -eo pipefail
          lake build MachineChecked Tools \
            Cases.Zip2005.Runtime.MemcmpLsym Cases.Zip2005.Runtime.WriteVectoredLsym 2>&1 | tee build.log
          # Lean's diagnostics, not Lake's notices (e.g. a dependency built from source).
          if grep -E '^warning: .*\.lean:' build.log; then
            echo "::error::the build has warnings"; exit 1
          fi

      # Each instruction set's LIMITS.md has a table of its instructions, lifted or not, that
      # the tool generates from the lift.
      - name: The instruction tables of the LIMITS.md are the generated ones
        run: |
          lake build decompile
          python3 scripts/decompile-check/check.py limits

      - name: decompile --to lean, end to end, on a small ELF
        run: scripts/to-lean-check/check.sh

      - name: Axiom check
        run: |
          lake env lean scripts/AxiomCheck.lean 2>&1 | tee axioms.log
          # Every listed axiom must be a standard one or a bv_decide certificate.
          bad=$(tr ',[]' '\n\n\n' < axioms.log | sed 's/^ *//; s/ *$//' \
            | grep -vE "^$|depends on axioms:|does not depend on any axioms|^(propext|Classical\.choice|Quot\.sound)$|\.bv_decide\.ax_" || true)
          if [ -n "$bad" ]; then
            echo "::error::non-standard axioms: $bad"; exit 1
          fi

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's cache
        run: lake exe cache get
      - name: Build everything
        run: |
          set -o pipefail
          lake build MachineChecked Tools Cases 2>&1 | tee build.log
          # The known baseline: warnings in the vendored code under Cases/Zip2005/Spec.
          if grep -E '^warning: .*\.lean:' build.log | grep -v '^warning: Cases/Zip2005/Spec/'; then
            echo "::error::warnings outside the Cases/Zip2005/Spec baseline"; exit 1
          fi
      - name: Axiom check, framework and case studies
        run: |
          for f in scripts/AxiomCheck.lean scripts/AxiomCheckCases.lean; do
            lake env lean "$f" 2>&1 | tee -a axioms.log
          done
          bad=$(tr ',[]' '\n\n\n' < axioms.log | sed 's/^ *//; s/ *$//' \
            | grep -vE "^$|depends on axioms:|does not depend on any axioms|^(propext|Classical\.choice|Quot\.sound)$|\.bv_decide\.ax_" || true)
          if [ -n "$bad" ]; then
            echo "::error::non-standard axioms: $bad"; exit 1
          fi
