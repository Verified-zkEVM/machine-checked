name = "machine-checked"
version = "0.1.0"
defaultTargets = ["MachineChecked", "Tools"]
# Generated image modules are deep literals; mirror riscv-zkvm's own setting.
moreLeanArgs = ["--tstack=400000"]

# The three instruction-set semantics (`docs/ISA.md`), each used unmodified at a pinned commit.

# RISC-V: the RV64IM machine model, its decoder and ELF loader. Pinned to riscv-zkvm's Lean
# v4.36 commit (Verified-zkEVM/riscv-zkvm#97, stacked on #96); re-pin to `main` once both
# land. A commit forfeits release oleans, but our import closure (`Rv64` + `Interpreter`)
# never reaches the generated Sail tree.
[[require]]
name = "riscv-zkvm"
git = "https://github.com/Verified-zkEVM/riscv-zkvm"
rev = "d81a91030371d1b66ad1a5ff5d348077d3690d6a"

# x86-64: Kraken's x64 semantics. Only `Kraken.X64.Semantics` and its closure are imported
# (`MachineChecked/X86/Kraken.lean`), not its examples and tests.
[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken"
rev = "ebd10ebd800f61d1c7170e06b1eaea2bd9cdea66"

# AArch64: the trusted package `arm64` of DeepMind's arm64-semantics, which lives in a
# subdirectory of google-deepmind/code-verification. Only that package is required, not
# its `ProofLib`, case studies or tests.
[[require]]
name = "arm64"
git = "https://github.com/google-deepmind/code-verification"
rev = "b0f729accbc21a0413e7ca4e1da43fa45b5f2e1b"
subDir = "arm64-semantics/Arm64"

# Mathlib, as a direct require at the tag matching `lean-toolchain`. Only the ZIP 2005
# specification and its closure (`Cases/Zip2005/Spec`) use it; `MachineChecked` and `Tools` do
# not import it (the executor takes `List.Subperm` from Batteries, which comes with it). Run
# `lake exe cache get` for the oleans.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0-rc2"

# The framework: ISA-independent definitions at the top level, RISC-V under `MachineChecked.RiscV`.
[[lean_lib]]
name = "MachineChecked"
globs = ["MachineChecked", "MachineChecked.+"]

# Build-time tooling (generators). Nothing in `MachineChecked` or `Cases` imports it.
[[lean_lib]]
name = "Tools"
globs = ["Tools.+"]

[[lean_exe]]
name = "gen-image"
root = "Tools.GenImage"
supportInterpreter = true

# Case studies: generated image data and the proofs about it.
[[lean_lib]]
name = "Cases"
globs = ["Cases.+"]

[[lean_exe]]
name = "frame-sweep"
root = "Tools.FrameSweep"
supportInterpreter = true

[[lean_exe]]
name = "infer-contracts"
root = "Tools.Infer"

